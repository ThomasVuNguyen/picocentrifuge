name: onshape renders

on:
  schedule:
    - cron: "30 12 * * 5"      # Fri 08:30 ET, ahead of friday itself
  workflow_dispatch:
    inputs:
      force:
        description: "re-render everything, ignore the microversion cache"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: render
        env:
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
        run: node scripts/onshape-render.mjs ${{ inputs.force && '--force' || '' }}

      - name: commit
        run: |
          git config user.name  "friday"
          git config user.email "friday@users.noreply.github.com"
          git add -A '*/renders' '*/.onshape-cache.json'
          if git diff --cached --quiet; then
            echo "no CAD changes this week"
            exit 0
          fi
          git commit -m "renders: $(cat .friday-onshape-changed.json | tr -d '\n[]\"' | sed 's/,/, /g')"
          git push
